name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ ${{ github.event_name }} == workflow_dispatch ]]; then
            raw_tag="${{ inputs.tag }}"
            tag="${raw_tag#refs/tags/}"
            # Some manual inputs are pasted as `vX.Y.Z*`; trim only a trailing wildcard.
            if [[ "$tag" == *"*" ]]; then
              tag="${tag%?}"
            fi

            if [[ -z "$tag" ]]; then
              echo "Input tag is required for workflow_dispatch."
              exit 1
            fi

            git fetch --tags --force
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag refs/tags/$tag does not exist."
              exit 1
            fi

            git checkout --detach "refs/tags/$tag"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Locate universal mod JAR
        id: mod_jar
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/*.jar)
          filtered=()
          for jar in "${jars[@]}"; do
            if [[ "$jar" == *-sources.jar || "$jar" == *-server.jar ]]; then
              continue
            fi
            filtered+=("$jar")
          done

          if [[ ${#filtered[@]} -ne 1 ]]; then
            echo "Expected exactly one universal mod JAR, found ${#filtered[@]}: ${filtered[*]}"
            exit 1
          fi

          echo "path=${filtered[0]}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          files: ${{ steps.mod_jar.outputs.path }}
          generate_release_notes: true
