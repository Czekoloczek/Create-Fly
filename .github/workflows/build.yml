name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      publish_release_jar:
        description: "Also upload direct .jar to an existing GitHub release tag"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Existing git tag for release upload (example: v1.0.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Locate universal mod JAR
        id: mod_jar
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/*.jar)
          filtered=()
          for jar in "${jars[@]}"; do
            if [[ "$jar" == *-sources.jar || "$jar" == *-server.jar ]]; then
              continue
            fi
            filtered+=("$jar")
          done

          if [[ ${#filtered[@]} -ne 1 ]]; then
            echo "Expected exactly one universal mod JAR, found ${#filtered[@]}: ${filtered[*]}"
            exit 1
          fi

          echo "path=${filtered[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload mod artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mods
          path: ${{ steps.mod_jar.outputs.path }}
          if-no-files-found: error

      - name: Resolve release tag
        id: release_tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release_jar }}
        shell: bash
        run: |
          raw_tag="${{ inputs.release_tag }}"
          tag="${raw_tag#refs/tags/}"
          tag="${tag%\*}"

          if [[ -z "$tag" ]]; then
            echo "Input release_tag is required when publish_release_jar=true."
            exit 1
          fi

          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag refs/tags/$tag does not exist."
            exit 1
          fi

          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload direct JAR to GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release_jar }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          files: ${{ steps.mod_jar.outputs.path }}
